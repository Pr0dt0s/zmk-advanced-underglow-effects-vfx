description: |
  Scattered pixels fade up and out at random.
  Which pixels twinkle is derived from a hash of the pixel and the cycle
  number rather than stored, so both halves of a split agree without
  exchanging anything and nothing accumulates between frames.

compatible: "zmk,vfx-layer-twinkle"

include: vfx-layer-common.yaml

properties:
  color:
    type: int
    required: true
    description: |
      Packed color, built with VFX_HSB(h, s, b).
  period-ms:
    type: int
    default: 1200
    description: |
      Lifetime of a single twinkle, in milliseconds.
  density:
    type: int
    default: 40
    description: |
      0-255, roughly the fraction of pixels lit at any moment.
