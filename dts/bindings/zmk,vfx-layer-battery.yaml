description: |
  Fills a fraction of its zone in proportion to battery charge.
  On a split each half reports its own battery, so a zone on each side
  shows that side's cell.

compatible: "zmk,vfx-layer-battery"

include: vfx-layer-common.yaml

properties:
  high-color:
    type: int
    required: true
    description: |
      Color of the filled portion at a healthy charge.
  low-color:
    type: int
    required: true
    description: |
      Color of the filled portion at or below warn-below.
  empty-color:
    type: int
    default: 0
    description: |
      Color of the unfilled portion. Zero brightness leaves it to
      whatever is underneath.
  warn-below:
    type: int
    default: 20
    description: |
      Percent at or below which low-color is used.
