# Included by every zmk,vfx-layer-* binding.

properties:
  zone:
    type: phandle
    required: true
    description: The zmk,vfx-zone this layer is allowed to draw into.

  blend:
    type: int
    default: 0
    description: |
      How this layer combines with what is already composited beneath it. Use
      the VFX_BLEND_* constants from dt-bindings/zmk/vfx.h.
    enum: [0, 1, 2, 3, 4]

  opacity:
    type: int
    default: 255
    description: |
      Layer opacity, 0-255. A layer at 0 is skipped entirely. With an
      opacity-source set this becomes the value reached at full signal rather
      than a constant.

  opacity-source:
    type: int
    default: 0
    description: |
      Let something the keyboard already knows drive how strongly this layer
      shows, using the VFX_SRC_* constants from dt-bindings/zmk/vfx.h:
      typing speed, charge remaining, or whether anyone is at the keyboard.

      This is how an ordinary generator becomes responsive without being
      rewritten. A fire whose opacity follows VFX_SRC_WPM banks up as you type
      and dies back when you stop, and it is still the same fire.

      Left at VFX_SRC_NONE the layer holds whatever opacity says.
    enum: [0, 1, 2, 3]

  opacity-min:
    type: int
    default: 0
    description: |
      Opacity when the signal reads zero, so a driven layer can fade toward
      dim rather than all the way out. Ignored without an opacity-source.

  opacity-full:
    type: int
    default: 0
    description: |
      Signal value at which the layer reaches its full opacity: words per
      minute for VFX_SRC_WPM, percent for VFX_SRC_BATTERY. 0 means 255, which
      suits percentages and is far too high for a WPM, so set it there.

      VFX_SRC_ACTIVITY ignores this, being a yes or no rather than a reading.

  tune-id:
    type: int
    default: 0
    description: |
      Opt this layer into being adjusted while the keyboard runs, by hue,
      level and speed, under the slot number given. 0, the default, means it
      cannot be, and it is then used exactly as written here.

      Layers sharing an id move together, which is how a scene built from
      several of them dims as one thing rather than in pieces.

      Everything else on a layer is fixed in flash by devicetree and cannot be
      written to at all; these three are the handles a running keyboard has.
      Slots run from 1 to VFX_TUNE_SLOTS - 1.
