description: |
  A named group of pixels that a layer can be scoped to. Give either a
  contiguous range or an explicit pixel list, not both.

compatible: "zmk,vfx-zone"

properties:
  range:
    type: array
    default: [0, 0]
    description: |
      Two cells, <first-index count>. Defaulted so that a zone using the
      pixels property still has this defined; the instantiation macros read
      whichever one applies.

  pixels:
    type: array
    description: Explicit pixel indices, for zones that are not contiguous.
