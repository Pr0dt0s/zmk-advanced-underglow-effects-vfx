description: |
  A named group of pixels that a layer can be scoped to. Give exactly one of
  range, pixels or keys.

compatible: "zmk,vfx-zone"

properties:
  range:
    type: array
    default: [0, 0]
    description: |
      Two cells, <first-index count>. Defaulted so that a zone using the
      pixels property still has this defined; the instantiation macros read
      whichever one applies.

  pixels:
    type: array
    description: Explicit pixel indices, for zones that are not contiguous.

  keys:
    type: array
    description: |
      Key positions, as the keymap numbers them. The engine turns them into
      pixel indices at startup using key-pixels, so "the modifiers" or "the
      home row" can be written as what it is rather than as LED indices read
      off a wiring diagram -- and it stays correct if the strip is rerouted.

      On a split, both halves are given the same list and each keeps only the
      keys whose pixel lands on its own strip, so one zone definition covers
      the whole board.
