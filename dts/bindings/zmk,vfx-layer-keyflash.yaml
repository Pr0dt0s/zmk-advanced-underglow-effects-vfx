description: |
  Lights the pixels nearest a pressed key and fades them in place.
  The cheaper, more legible cousin of the ripple.

compatible: "zmk,vfx-layer-keyflash"

include: vfx-layer-common.yaml

# Distance properties below are in the units pixel-positions uses. The shipped
# maps put about 10 units between adjacent LEDs and these defaults assume that;
# without a position map distances are strip indices, so scale them down.

properties:
  color:
    type: int
    required: true
    description: |
      Packed color, built with VFX_HSB(h, s, b).
  decay-ms:
    type: int
    default: 400
    description: |
      How long a flash takes to fade out.
  spread:
    type: int
    default: 12
    description: |
      Virtual pixels either side of the key that light up.
