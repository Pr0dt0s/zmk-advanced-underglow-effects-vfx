description: |
  A cyclic multi-stop gradient across the virtual strip, optionally scrolling.
  Two stops of the same hue at different brightness gives a comet; a full set
  of hues gives a rainbow equivalent to ZMK's built-in swirl.

compatible: "zmk,vfx-layer-gradient"

include: vfx-layer-common.yaml

properties:
  stops:
    type: array
    required: true
    description: |
      Colors built with VFX_HSB(h, s, b). The gradient is cyclic, so the last
      stop blends back into the first. Interpolation takes the short way around
      the hue circle.

  scroll-speed:
    type: int
    default: 0
    description: |
      Axis units per second, scaled by the engine's global speed setting.
      Negative scrolls the other way. 0 holds the gradient still.

      Units follow the axis: strip position for VFX_AXIS_STRIP, pixel-positions
      units for X, Y and RADIAL, and 256ths of a turn for ANGLE and SPIRAL.

  span:
    type: int
    default: 0
    description: |
      Axis units covered by one full cycle of the gradient. 0 stretches one
      cycle across the board, whichever way it is pointing.

  axis:
    type: int
    default: 0
    description: |
      Which way it runs across the board: VFX_AXIS_STRIP (along the wire, the
      default), VFX_AXIS_X, VFX_AXIS_Y, VFX_AXIS_RADIAL (out from the middle),
      VFX_AXIS_ANGLE (around it) or VFX_AXIS_SPIRAL.

      Everything but VFX_AXIS_STRIP needs pixel-positions on the engine node.
      Without a map there is no board to run across, so they all fall back to
      the strip rather than going dark.
