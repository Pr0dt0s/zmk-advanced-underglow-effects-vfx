name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Compositor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the engine core with no Zephyr in scope at all. If this stops
      # working, the compositor has grown a kernel dependency it should not
      # have, and the simulator would stop matching the firmware.
      - name: Build and run
        working-directory: tests
        run: make test

  simulator:
    name: WebAssembly simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build
        run: ./sim/build.sh

      # The self-contained build is what gets published as a Claude Artifact,
      # where fetch is blocked. Building it here keeps the inlining in step
      # with the page rather than breaking the next time it is needed.
      - name: Build the single-file version
        run: python3 sim/build-artifact.py

      # The README's clips are recorded from this page by the Pages workflow.
      # Recording two of them here means a broken recorder fails on the push
      # that broke it, rather than on the next deploy to main.
      - name: Check the clip recorder still runs
        run: |
          sudo apt-get install -y gifsicle
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          pip install Pillow
          node tools/record-gifs.mjs fire nexus

      # Linking a generator says nothing about whether the page can reach it,
      # and one wired up wrong renders black rather than failing. This drives
      # the page and asserts on what comes out: dark until a key is pressed,
      # still lit while one is held, and a driven opacity that moves with its
      # signal.
      - name: Check the generators behave in a browser
        run: |
          python3 -m http.server 8899 -d docs/sim &
          sleep 2
          node tools/verify-sim.mjs

      # There is no real keyboard running the raw-hid transport to test
      # against, so this drives host.js the same way it would drive a real
      # one, against a fake HID device that speaks the exact wire format
      # hid_transport.c does.
      - name: Check the host control panel against a fake HID device
        run: node tools/verify-host-hid.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: sample-clips
          path: docs/img

  firmware:
    name: Firmware (${{ matrix.shield }})
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - shield: lily58_left
            board: "nice_nano//zmk"
          - shield: lily58_right
            board: "nice_nano//zmk"
    steps:
      - name: Checkout the module
        uses: actions/checkout@v4
        with:
          path: module

      # The west workspace is built beside the module rather than on top of
      # it. west init -l would make the module checkout the workspace root,
      # and west would then clone Zephyr into module/zephyr, colliding with
      # the module's own zephyr/module.yml.
      - name: Stage the manifest
        run: |
          mkdir -p ws
          cp -r module/example ws/config

      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            ws/modules
            ws/tools
            ws/zephyr
            ws/bootloader
            ws/zmk
          key: zmk-${{ hashFiles('module/example/west.yml') }}

      - name: Initialise the workspace
        working-directory: ws
        run: |
          west init -l config
          west update --fetch-opt=--filter=blob:none
          west zephyr-export

      # -DZMK_EXTRA_MODULES points the build at this checkout rather than a
      # published copy, so CI compiles the code in the pull request. This is
      # the only place the devicetree macros in src/scenes.c are exercised
      # against a real devicetree.
      - name: Build
        working-directory: ws
        run: |
          west build -s zmk/app -b "${{ matrix.board }}" -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/ws/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/module"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}
          path: ws/build/zephyr/zmk.uf2

  # Builds with the settings the defaults do not cover, so a Kconfig
  # combination cannot rot unnoticed.
  firmware-variants:
    name: Firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: split sync
            shield: lily58_left
            args: -DCONFIG_ZMK_VFX_SPLIT_SYNCED=y -DCONFIG_ZMK_VFX_SPLIT_FREE=n
            prep: "true"
          - name: no power gate
            shield: lily58_left
            args: -DCONFIG_ZMK_VFX_AUTO_POWER_GATE=n
            prep: "true"
          # Turning the shim off unbinds rgb_ug, and Zephyr resolves
          # devicetree before Kconfig, so a keymap cannot guard its bindings
          # with #if. Strip them instead, which is exactly what a user
          # disabling the shim has to do to their own keymap.
          - name: no rgb_ug shim
            shield: lily58_left
            args: -DCONFIG_ZMK_VFX_RGB_UNDERGLOW_COMPAT=n
            prep: "sed -i -E 's/&rgb_ug [A-Z_]+/\\&trans/g' ws/config/lily58.keymap"
          - name: no indicators
            shield: lily58_left
            args: -DCONFIG_ZMK_VFX_INDICATORS=n
            prep: "true"
          # RAW_HID (from zmk-raw-hid) only builds on the central, same as
          # CONFIG_ZMK_WPM above -- lily58_left is the central in this
          # example. The adapter shield brings CONFIG_RAW_HID=y itself; only
          # this module's own transport needs enabling here.
          - name: raw hid transport
            shield: lily58_left raw_hid_adapter
            args: -DCONFIG_ZMK_VFX_RAW_HID=y -DCONFIG_ZMK_VFX_RUNTIME_SCENES=y
            prep: "true"
          # VFX_MAX_CHANNELS is sized to DT_NUM_INST_STATUS_OKAY(zmk_vfx_channel)
          # rather than a fixed ceiling (see scenes.h); six is deliberately
          # more than the old fixed value of 4, so this is what would have
          # silently clamped, or failed to link, under the old scheme.
          # Layered on top of lily58_left's own overlay rather than
          # replacing it, and runtime scenes turned on too so both of the
          # arrays VFX_MAX_CHANNELS sizes -- engine.c's and
          # runtime_scene.c's -- build against the real count.
          - name: many channels
            shield: lily58_left
            args: -DCONFIG_ZMK_VFX_RUNTIME_SCENES=y
              -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/ws/config/many-channels.overlay"
            prep: "true"
    steps:
      - name: Checkout the module
        uses: actions/checkout@v4
        with:
          path: module

      # The west workspace is built beside the module rather than on top of
      # it. west init -l would make the module checkout the workspace root,
      # and west would then clone Zephyr into module/zephyr, colliding with
      # the module's own zephyr/module.yml.
      - name: Stage the manifest
        run: |
          mkdir -p ws
          cp -r module/example ws/config

      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            ws/modules
            ws/tools
            ws/zephyr
            ws/bootloader
            ws/zmk
          key: zmk-${{ hashFiles('module/example/west.yml') }}

      - name: Initialise the workspace
        working-directory: ws
        run: |
          west init -l config
          west update --fetch-opt=--filter=blob:none
          west zephyr-export

      - name: Adjust the config for this variant
        run: ${{ matrix.prep }}

      - name: Build
        working-directory: ws
        run: |
          west build -s zmk/app -b "nice_nano//zmk" -- \
            -DSHIELD="${{ matrix.shield }}" \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/ws/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/module" \
            ${{ matrix.args }}
