# Manifest for the example build. The module itself is supplied to the build
# with -DZMK_EXTRA_MODULES so CI compiles the checkout under test rather than
# whatever is published.
#
# zmk-raw-hid is only exercised by the "raw hid transport" firmware-variants
# build (CONFIG_ZMK_VFX_RAW_HID plus the raw_hid_adapter shield), not by the
# two default shields, but the project has to be in every build's manifest
# regardless since west resolves the whole manifest up front.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zzeneg
      url-base: https://github.com/zzeneg
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
  self:
    path: config
