# VFX owns the strip, so ZMK's own underglow must be off. Leaving both on
# would have two engines writing the same pixels.
CONFIG_ZMK_RGB_UNDERGLOW=n

CONFIG_ZMK_VFX=y
CONFIG_ZMK_VFX_BRT_START=60

# Cut the rail when a frame comes out entirely black. This is where most of
# the battery saving is: the strip draws tens of milliamps even showing black.
CONFIG_ZMK_VFX_AUTO_POWER_GATE=y
CONFIG_ZMK_VFX_BLACKOUT_DELAY_MS=500

# Free-running is the default and costs no radio traffic. Swap the two lines
# below to keep the halves aligned indefinitely at the cost of a little.
CONFIG_ZMK_VFX_SPLIT_FREE=y
# CONFIG_ZMK_VFX_SPLIT_SYNCED=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The indicators that read state ZMK only computes when asked. Without these
# the layers still build, they just sit at their resting value.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_WPM=y
