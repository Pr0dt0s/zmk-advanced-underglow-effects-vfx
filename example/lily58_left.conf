# Left half only. ZMK applies every matching conf file, so this is merged on
# top of lily58.conf rather than replacing it.
#
# WPM counts keycodes, and ZMK only produces keycode events on the central.
# It compiles src/wpm.c for every role all the same, so setting this in the
# shared conf builds a peripheral that cannot link:
#
#   wpm.c:38: undefined reference to `as_zmk_keycode_state_changed'
#
# The indicator is central-only in any case: the peripheral has no idea how
# fast you are typing.
CONFIG_ZMK_WPM=y
